# A job posting as a candidate would see it. The job analyst turns its text into a checklist.

title = "Backend Engineer (Python), Payments Platform (mid-level)"
text = """
Requirements
- Strong Python skills, 3+ years
- Experience building and maintaining REST APIs
- Hands-on experience with relational databases (PostgreSQL preferred), including schema design, not just writing queries
- Comfortable owning services in production: deployment, monitoring and on-call
- Team player with great communication skills

Nice to have
- Kubernetes and AWS
- Performance tuning (caching, query optimisation)
- Mentoring junior engineers
- Fintech or payments experience
"""

# Hand-written until the company researcher exists. The company is invented.
brief = """
A payments platform for online shops in Europe, at scale-up stage with about 120 engineers.
The Payments Platform team (8 engineers) owns the services that take card payments and pay merchants.
Stack: Python, PostgreSQL, Kubernetes on AWS.
This year's focus: fewer failed payments and two new payment methods.
"""

# The recruiter's screen, checked by code: current title, dated years, and names in the top third.
[recruiter]
# "backend developer" added after the first screen of the 11 CVs: good-1 is a "Backend Developer".
titles = ["backend engineer", "backend developer", "software engineer", "python developer"]
keywords = ["Python", "REST"]
min_years = 3

# The hiring manager's targets, from the brief; code writes them into HM1 and HM2 (Step 4.3e).
# Without them the model had to infer the team's system from the brief and read any production
# REST API as "the same kind of system".
[hiring_manager]
system = "a service that processes card payments or pays out money"
goals = ["fewer failed payments", "new payment methods"]

# Requirements lines the devil's advocate skips (Step 4.3f): a trait no CV can prove, already
# dropped from the tech lead's checklist; every CV would get a "not shown" objection for it.
[devils_advocate]
ignore = ["Team player with great communication skills"]
