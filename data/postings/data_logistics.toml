# A job posting as a candidate would see it. The job analyst turns its text into a checklist.
# Step 4.2: the job analyst's held-out posting. Its reviewed checklist is written before any draft.

title = "Data Engineer, Logistics Analytics (mid-level)"
text = """
Requirements
- 3+ years of Python and SQL
- Built and maintained batch data pipelines that other teams rely on
- Hands-on with a cloud data warehouse (Snowflake or BigQuery), including designing data models for analytics
- Own your pipelines in production: scheduling, data-quality checks and the on-call rota
- Strong stakeholder management

Nice to have
- Airflow or Dagster
- Streaming data with Kafka
- A track record of cutting pipeline cost or runtime
- Logistics or supply-chain experience
- Mentoring analysts on SQL
"""

# Hand-written until the company researcher exists. The company is invented.
brief = """
A parcel delivery company across the Middle East, with about 40 people in data and analytics.
The analytics team (6 data engineers, 15 analysts) builds the warehouse that operations and finance
use to plan routes and costs. Stack: Python, SQL, BigQuery, Airflow.
This year's focus: predicting delivery delays and cutting the warehouse bill.
"""

# The recruiter's screen, checked by code: current title, dated years, and names in the top third.
[recruiter]
titles = ["data engineer", "analytics engineer"]
keywords = ["Python", "SQL"]
min_years = 3

# The hiring manager's targets, from the brief; code writes them into HM1 and HM2 (Step 4.3e).
[hiring_manager]
system = "data pipelines that load a warehouse which business teams, such as operations or finance, use to plan their work"
goals = ["predicting delivery delays", "a lower warehouse bill"]
