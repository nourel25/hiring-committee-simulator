# Labelled claims for the grounding judge (Step 5.2). Each claim is a line a refiner might write,
# citing facts (F ids) built by code from a labelled case's CV (hcs/profile.py build_facts).
# Every claim passes the rules layer (no new numbers or names), so this set measures only what the
# judge must read: meaning. Unsupported claims inflate ownership, scope or seniority in plain words.
# Written and keyed before any judge run (2026-10-23); not yet independently reviewed.
# dev: may be used to change the judge's prompt. heldout: measured once per prompt version.

[[claims]]
case = "borderline-1"
split = "dev"
text = "Python engineer who maintains a public REST API used by 12,000 merchants"
facts = ["F2"]
supported = true

[[claims]]
case = "borderline-1"
split = "dev"
text = "Designed the Django database schema for the reports"
facts = ["F5"]
supported = false
note = "adding fields to existing models is not designing the schema"

