# Held-out case for checklist v3: written and keyed before any run, not used to word TL3 or TL8.
# The TL3 and TL8 traps in new forms: migrations on an existing schema, running meetings,
# and leading a technical rewrite.
# Scoring rule (Option B): passed is always scored; evidence only when expected passed is true.
# No evidence key = no evidence (TOML has no null).
id = "borderline-3"
label = "borderline"
split = "heldout"
checklist = "backend_payments"
# TL1, TL2, TL4 (9) = 9/16 = 5.6 -> lean_no (TL3 fails, so the gate also applies).
# A wrong TL3 pass would give 12/16 = 7.5 -> lean_hire, so the decision shows the TL3 fix.
expected_decision = "lean_no"

cv = """
Backend Engineer, insurance platform (2021-present)
- Develop the Python claims service that the mobile app and partner insurers call through its REST API, with 40,000 claims a month
- Write Alembic migrations to add the new columns and indexes the product team requests
- Ship releases to production myself through the team's Jenkins pipeline
- Run the team's sprint planning and retrospectives every two weeks
- Led the rewrite of the claims search from SQL LIKE queries to Elasticsearch

Junior Developer, web agency (2019-2021)
- Built WordPress plugins in PHP for client websites
"""

[expected.TL1]
passed = true
evidence = "Develop the Python claims service that the mobile app and partner insurers call through its REST API, with 40,000 claims a month"

[expected.TL2]
passed = true
evidence = "Develop the Python claims service that the mobile app and partner insurers call through its REST API, with 40,000 claims a month"

[expected.TL3]
# Trap: migrations change an existing schema; they don't design one.
passed = false
evidence = "Write Alembic migrations to add the new columns and indexes the product team requests"

[expected.TL4]
passed = true
evidence = "Ship releases to production myself through the team's Jenkins pipeline"

[expected.TL5]
passed = false

[expected.TL6]
passed = false

[expected.TL7]
# Trap: an improvement with no measurement.
passed = false
evidence = "Led the rewrite of the claims search from SQL LIKE queries to Elasticsearch"

[expected.TL8]
# Traps: running meetings, and leading a technical rewrite, are not managing people.
passed = false
evidence = "Run the team's sprint planning and retrospectives every two weeks"

# The recruiter's key (data/checklists/recruiter.toml), judged on the top third only.
# 12/12 = 10.0
[recruiter]
expected_decision = "strong_hire"

[recruiter.expected.R1]
passed = true

[recruiter.expected.R2]
passed = true

[recruiter.expected.R3]
passed = true

