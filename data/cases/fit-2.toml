# Stripe to collect them; none of it processes payments. Written and keyed before any v2
# run; not yet independently reviewed.
# Scoring rule (Option B): passed is always scored; evidence only when expected passed is true.
# No evidence key = no evidence (TOML has no null).
id = "fit-2"
label = "good"
split = "heldout"
checklist = "backend_payments"
# TL1-TL4 (12) + TL6, TL7 (2) = 14/16 = 8.75 -> strong_hire.
expected_decision = "strong_hire"

cv = """
Backend Engineer, consumer lending startup (2020-present)
- Built the Python REST API that scores loan applications in our lending app, used by 80,000 borrowers
- Built the service that calls Stripe to collect monthly loan repayments
- Designed the PostgreSQL schema for loans and repayments: which tables exist and how they relate
- Deploy my services to production myself on our Kubernetes cluster
- Cut the scoring API's response time from 3 seconds to 400 ms by caching credit bureau results

Junior Developer, insurance broker (2017-2020)
- Built internal tools in Django
"""

