# Held-out case for checklist v2: written and keyed before any run, not used to word TL1.
# Scoring rule: passed is always scored; evidence only when expected passed is true.
# No evidence key = no evidence (TOML has no null).
id = "poor-2"
label = "poor"
split = "heldout"
checklist = "backend_payments"
# TL4 (3) + TL5, TL6 (2) = 5/16 = 3.1 -> strong_no.
# A wrong TL1 pass would give 8/16 = 5.0 -> lean_no, so the decision shows the TL1 fix.
expected_decision = "strong_no"

cv = """
Platform Engineer, insurance company (2021-present)
- Wrote internal command-line tools in Python that engineers run to rotate credentials and clean up old backups
- Maintain the Terraform modules and GitLab CI templates used by 40 product teams
- Run the Prometheus and Grafana stack and lead the weekly incident review
- Moved 30 services from VMs to the company's Kubernetes clusters with Helm charts

IT Support Technician, university (2018-2021)
- Automated laptop setup with PowerShell and Python scripts
"""

[expected.TL1]
# Trap: tools people run, not services other systems call.
passed = false
evidence = "Wrote internal command-line tools in Python that engineers run to rotate credentials and clean up old backups"

[expected.TL2]
passed = false

[expected.TL3]
passed = false

[expected.TL4]
passed = true
evidence = "Moved 30 services from VMs to the company's Kubernetes clusters with Helm charts"

[expected.TL5]
passed = true
evidence = "Run the Prometheus and Grafana stack and lead the weekly incident review"

[expected.TL6]
passed = true
evidence = "Moved 30 services from VMs to the company's Kubernetes clusters with Helm charts"

[expected.TL7]
passed = false

[expected.TL8]
# Trap: leading a meeting is not leading people.
passed = false
evidence = "Run the Prometheus and Grafana stack and lead the weekly incident review"

# The recruiter's key (data/checklists/recruiter.toml), judged on the top third only.
# 8/12 = 6.7, capped at lean_no (R1: Platform Engineer)
[recruiter]
expected_decision = "lean_no"

[recruiter.expected.R1]
passed = false

[recruiter.expected.R2]
passed = true

[recruiter.expected.R3]
passed = false

[recruiter.expected.C1]
passed = true
evidence = "Wrote internal command-line tools in Python that engineers run to rotate credentials and clean up old backups"

[recruiter.expected.C2]
passed = true
evidence = "Maintain the Terraform modules and GitLab CI templates used by 40 product teams"

[recruiter.expected.R4]
passed = true

# The hiring manager's key (full CV + the posting's brief), written before any run
# (Step 4.3e) while the user could not review it. HM1-HM4 are nice-to-haves: passes / 4 x 10.
[hiring_manager]
expected_decision = "strong_no"

[hiring_manager.expected.HM1]
passed = false

[hiring_manager.expected.HM2]
passed = false

[hiring_manager.expected.HM3]
# Trap: 30 services moved is a count, not an effect.
passed = false

[hiring_manager.expected.HM4]
passed = true
evidence = "Run the Prometheus and Grafana stack and lead the weekly incident review"
