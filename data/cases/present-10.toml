- Schedule my pipelines myself in Airflow, with tests on nulls and row counts that stop a bad load
- Cut the nightly load from 3 hours to 50 minutes by switching to incremental loads

Junior Analyst, consultancy (2018-2020)
- Built Excel models for clients
