# Held-out case for the hiring manager (checklist v2), against a too-strict HM1: a subscription
# business that charges saved cards is a payments system although the company is not in payments,
# and "failed renewal charges" is this year's goal in other words. Written and keyed
# before any v2 run; not yet independently reviewed.
# Scoring rule (Option B): passed is always scored; evidence only when expected passed is true.
# No evidence key = no evidence (TOML has no null).
id = "fit-1"
label = "good"
split = "heldout"
checklist = "backend_payments"
# TL1-TL4 (12) = 12/16 = 7.5 -> lean_hire.
expected_decision = "lean_hire"

cv = """
Backend Engineer, subscription box company (2021-present)
- Built the Python service that charges customers' saved cards each month for their subscriptions
- Cut failed renewal charges from 6% to 2% by retrying declined cards at better times
- Maintain the REST API that our web app uses to manage subscriptions
- Designed the PostgreSQL schema for subscriptions and invoices: which tables exist and how they relate
- Deploy my services to production myself with GitLab CI

Junior Developer, web agency (2018-2021)
- Built Django sites for local businesses
"""

