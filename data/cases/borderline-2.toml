# Held-out case for checklist v2: written and keyed before any run, not used to word TL1.
# Scoring rule: passed is always scored; evidence only when expected passed is true.
# No evidence key = no evidence (TOML has no null).
id = "borderline-2"
label = "borderline"
split = "heldout"
checklist = "backend_payments"
# TL1, TL3, TL4 (9) + TL7, TL8 (2) = 11/16 = 6.9 -> lean_hire by band,
# but must-have TL2 fails (a service, but not a REST API), so the gate caps it at lean_no.
expected_decision = "lean_no"

cv = """
Software Engineer, food delivery company (2020-present)
- Built the Python service that consumes order events from Kafka and assigns couriers, handling 200,000 orders a day
- Designed the PostgreSQL tables for courier shifts and payouts
- Ship the services to production through Argo CD after code review
- Cut courier assignment time from 9 seconds to 2 by batching database writes
- Guide three graduate engineers through their first year with weekly one-to-ones

Data Engineer Intern, bank (2019)
- Wrote Python scripts to load CSV exports into the data warehouse
"""

[expected.TL1]
# The point of this case: a background service must pass under v2.
passed = true
evidence = "Built the Python service that consumes order events from Kafka and assigns couriers, handling 200,000 orders a day"

[expected.TL2]
# Trap: a service with real traffic, but not a REST API.
passed = false
evidence = "Built the Python service that consumes order events from Kafka and assigns couriers, handling 200,000 orders a day"

[expected.TL3]
passed = true
evidence = "Designed the PostgreSQL tables for courier shifts and payouts"

[expected.TL4]
passed = true
evidence = "Ship the services to production through Argo CD after code review"

[expected.TL5]
passed = false

[expected.TL6]
# Trap: Argo CD implies Kubernetes, but the CV never says it.
passed = false
evidence = "Ship the services to production through Argo CD after code review"

[expected.TL7]
passed = true
evidence = "Cut courier assignment time from 9 seconds to 2 by batching database writes"

[expected.TL8]
passed = true
evidence = "Guide three graduate engineers through their first year with weekly one-to-ones"

# The recruiter's key (data/checklists/recruiter.toml), judged on the top third only.
# 11/12 = 9.2 (no REST in the top third)
[recruiter]
expected_decision = "strong_hire"

[recruiter.expected.R1]
passed = true

[recruiter.expected.R2]
passed = true

[recruiter.expected.R3]
passed = false

[recruiter.expected.C1]
passed = true
evidence = "Built the Python service that consumes order events from Kafka and assigns couriers, handling 200,000 orders a day"

[recruiter.expected.C2]
passed = true
evidence = "Built the Python service that consumes order events from Kafka and assigns couriers, handling 200,000 orders a day"

[recruiter.expected.R4]
passed = true

# The hiring manager's key (full CV + the posting's brief), written before any run
# (Step 4.3e) while the user could not review it. HM1-HM4 are nice-to-haves: passes / 4 x 10.
[hiring_manager]
expected_decision = "lean_no"

[hiring_manager.expected.HM1]
# Trap: payout tables inside a courier-assignment service; its main job is assigning couriers.
passed = false

[hiring_manager.expected.HM2]
passed = false

[hiring_manager.expected.HM3]
passed = true
evidence = "Cut courier assignment time from 9 seconds to 2 by batching database writes"

[hiring_manager.expected.HM4]
passed = true
evidence = "Ship the services to production through Argo CD after code review"
