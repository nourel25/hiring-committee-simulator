# Held-out case for recruiter checklist v4: both lenient traps in new forms. Under the title the top
# third is a list of tools and a line about how the team works, with numbers that are neither a result
# nor a scale ("Python 3.12", "two-week sprints"). Written and keyed before any v4 run.
# Scoring rule (Option B): passed is always scored; evidence only when expected passed is true.
# No evidence key = no evidence (TOML has no null).
id = "present-9"
label = "good"
split = "heldout"
checklist = "backend_payments"
# TL1-TL4 (12) + TL7 (1) = 13/16 = 8.1 -> strong_hire.
expected_decision = "strong_hire"

cv = """
Software Engineer, e-commerce company (2020-present)
Tech stack: Python 3.12, FastAPI, PostgreSQL, Docker, AWS
- Work in an agile team with two-week sprints and daily stand-ups
- Built and maintain the Python REST APIs for the checkout, used by shoppers in production
- Designed the PostgreSQL schema for orders and payments: which tables exist and how they relate
- Deploy my services to production myself with GitHub Actions
- Cut the checkout API's response time from 1.2 seconds to 250 ms with query indexes

Junior Developer, marketing agency (2018-2020)
- Built landing pages in PHP
"""

[expected.TL1]
passed = true
evidence = "Built and maintain the Python REST APIs for the checkout, used by shoppers in production"

[expected.TL2]
passed = true
evidence = "Built and maintain the Python REST APIs for the checkout, used by shoppers in production"

[expected.TL3]
passed = true
evidence = "Designed the PostgreSQL schema for orders and payments: which tables exist and how they relate"

[expected.TL4]
passed = true
evidence = "Deploy my services to production myself with GitHub Actions"

[expected.TL5]
passed = false

[expected.TL6]
# Trap: Docker and AWS in a tools list say nothing about an orchestration platform.
passed = false

[expected.TL7]
passed = true
evidence = "Cut the checkout API's response time from 1.2 seconds to 250 ms with query indexes"

[expected.TL8]
passed = false

# The recruiter's key, judged on the top third (the first 3 of 9 lines; the model sees lines 2-3).
# R1, R2 (6) + R4 (1) = 7/12 = 5.8 -> lean_no. A lenient C1 alone gives 10/12 = 8.3 strong_hire,
# so the C1 trap decides the outcome.
[recruiter]
expected_decision = "lean_no"

[recruiter.expected.R1]
passed = true

[recruiter.expected.R2]
passed = true

[recruiter.expected.R3]
# REST appears only on line 4.
passed = false

[recruiter.expected.C1]
# Trap: a list of tools and how the team meets never say what the candidate builds or runs.
# Rule, for every case: a list of tools is not a description of work.
passed = false

[recruiter.expected.C2]
# Trap: a language version and a sprint length are numbers, but not a result or a scale of work.
passed = false

[recruiter.expected.R4]
passed = true

# The hiring manager's key (full CV + the posting's brief), written before any run
# (Step 4.3e) while the user could not review it. HM1-HM4 are nice-to-haves: passes / 4 x 10.
[hiring_manager]
expected_decision = "lean_no"

[hiring_manager.expected.HM1]
# Trap: a shop's checkout calls a payment provider; it does not process payments itself.
passed = false

[hiring_manager.expected.HM2]
passed = false

[hiring_manager.expected.HM3]
passed = true
evidence = "Cut the checkout API's response time from 1.2 seconds to 250 ms with query indexes"

[hiring_manager.expected.HM4]
passed = true
evidence = "Deploy my services to production myself with GitHub Actions"
