# Tech-lead checklist for one posting.
# The tech lead's checks test what the candidate did; named tools, industries and
# year counts are lookups for code. Importance is used by code only, never shown to the model.
name = "backend_payments"
posting = "Backend Engineer (Python), Payments Platform (mid-level)"
# v2 (Step 3.5a): TL1 says what a backend service is; v1 let Python scripts pass.
# v3 (Step 3.5c): TL3 and TL8 say what counts; v2 left "changing an existing schema" and
# "leading meetings" open, and several model families read them as passes.
version = 3

# Must-haves: weight 3. Any failed must-have caps the decision at lean_no.

[[items]]
id = "TL1"
text = "Has built server-side applications in Python that other systems or users call, such as APIs or background services, as part of their job; scripts, notebooks and reports do not count"
importance = "must"

[[items]]
id = "TL2"
text = "Has maintained REST APIs that serve real users in production"
importance = "must"

[[items]]
id = "TL3"
text = "Has designed a relational database schema, deciding which tables exist and how they relate; querying or changing an existing schema does not count"
importance = "must"

[[items]]
id = "TL4"
text = "Has deployed services to production themselves"
importance = "must"

# Nice-to-haves: weight 1.
# TL5 is a requirement in the posting, demoted here because CVs rarely mention it.

[[items]]
id = "TL5"
text = "Has monitored production services or taken part in an on-call rotation"
importance = "nice"

[[items]]
id = "TL6"
text = "Has run containerised services on an orchestration platform such as Kubernetes"
importance = "nice"

[[items]]
id = "TL7"
text = "Has measurably improved the performance of a system"
importance = "nice"

[[items]]
id = "TL8"
text = "Has mentored or managed other engineers, such as coaching, onboarding or line management; leading meetings, projects or technical work does not count"
importance = "nice"
