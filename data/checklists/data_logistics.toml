# Tech-lead checklist for the data engineer posting (data/postings/data_logistics.toml).
# Written before any job-analyst draft of this posting, so it can measure the analyst (Step 4.2).
# Same rules as backend_payments: checks test what the candidate did, and say what does not count;
# named tools, year counts and industries are lookups for code. Importance is used by code only.
# Lookups from the posting: Python, SQL, 3+ years, Snowflake, BigQuery, Airflow, Dagster, Kafka,
# logistics or supply chain. Dropped: "Strong stakeholder management" (a trait no CV can prove).
name = "data_logistics"
posting = "Data Engineer, Logistics Analytics (mid-level)"
version = 1

# Must-haves: weight 3. Any failed must-have caps the decision at lean_no.
# TL1 covers posting lines 1 and 2: pipelines are the work this role does with Python and SQL,
# so one check avoids counting one CV line twice (the TL1/TL2 compromise in backend_payments).

[[items]]
id = "TL1"
text = "Has built and maintained batch data pipelines in Python or SQL that other teams rely on, as part of their job; one-off scripts, notebooks and reports that only the author uses do not count"
importance = "must"

[[items]]
id = "TL2"
text = "Has designed data models for analytics in a data warehouse, deciding which tables exist and how they relate; querying existing models or adding columns to them does not count"
importance = "must"

[[items]]
id = "TL3"
text = "Has run their own pipelines in production on a scheduler; building pipelines that someone else deploys and runs does not count"
importance = "must"

# Nice-to-haves: weight 1.
# TL4 and TL5 are requirements in the posting, made nice because many qualified CVs never mention them.
# Airflow and Dagster are lookups only: scheduling is already TL3.

[[items]]
id = "TL4"
text = "Has added automated data-quality checks to pipelines, such as tests on row counts, nulls or freshness; fixing bad data by hand after someone reports it does not count"
importance = "nice"

[[items]]
id = "TL5"
text = "Has taken part in an on-call rota for data pipelines or other production systems"
importance = "nice"

[[items]]
id = "TL6"
text = "Has built a streaming pipeline that processes events continuously; batch jobs that read from a message queue on a schedule do not count"
importance = "nice"

[[items]]
id = "TL7"
text = "Has measurably reduced a pipeline's cost or runtime; an improvement without a number or a before-and-after does not count"
importance = "nice"

[[items]]
id = "TL8"
text = "Has coached other people on SQL or data practices, such as reviews, workshops or onboarding; answering occasional questions does not count"
importance = "nice"
