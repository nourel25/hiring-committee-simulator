# The recruiter's checklist, the same for every posting: a first look at the top third of the CV.
# R1-R4 are computed by code (hcs/screening.py) from the posting's [recruiter] screen; the model
# never sees them. C1-C2 are judged by the model on the top third only. Importance is used by code only.
# A failed C check is usually a presentation problem the refiner can fix, not a missing skill.
# v2 (Step 4.3c): C3 "short bullets" moved to code as R4, because no single quote can prove a property
# of the whole text (the model failed it on every CV); C1 no longer says "the first lines", which was
# read two ways, and leaves the title's position to R1.
name = "recruiter"
posting = "any"
version = 2

# Must-haves: weight 3. Any failed must-have caps the decision at lean_no.

[[items]]
id = "R1"
text = "The current job title matches the role"
importance = "must"

[[items]]
id = "R2"
text = "Has the years of experience the posting asks for, in dated roles"
importance = "must"

[[items]]
id = "C1"
text = "The role and the kind of work the candidate does are clear from the top of the CV; a summary of personal qualities alone does not count"
importance = "must"

# Nice-to-haves: weight 1.
# R3 is strict on purpose (a recruiter skims), so a miss is a presentation fix, not a reason to reject.

[[items]]
id = "R3"
text = "Names the posting's must-have tools in the top third of the CV"
importance = "nice"

[[items]]
id = "R4"
text = "The top third is short lines that can each be read at a glance"
importance = "nice"

[[items]]
id = "C2"
text = "At least one bullet states a result or a scale of use with a number, such as users, requests, money or time saved; a list of duties without numbers does not count"
importance = "nice"
