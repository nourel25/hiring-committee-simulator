# The recruiter's checklist, the same for every posting: a first look at the top third of the CV.
# R1-R4 are computed by code (hcs/screening.py) from the posting's [recruiter] screen; the model
# never sees them. C1-C2 are judged by the model on the top third only. Importance is used by code only.
# A failed C check is usually a presentation problem the refiner can fix, not a missing skill.
# v2 (Step 4.3c): C3 "short bullets" moved to code as R4, because no single quote can prove a property
# of the whole text (the model failed it on every CV); C1 no longer says "the first lines", which was
# read two ways, and leaves the title's position to R1.
# v3 (Step 4.3d): C1 and C2 say what does not count. On held-out cases v2 passed C1 on buzzwords and
# on the job title line alone, and C2 on the employer's numbers: form over meaning.
# v4 (Step 4.3d): v3 quoted the title line for C1 in 11 of 19 cases, so code now removes the dated
# role lines from what the model sees (hcs/screening.py, recruiter_view) and C1 no longer names
# titles; v3's C2 also failed users of the candidate's work ("12,000 merchants"), so C2 now
# excludes numbers that describe the company as a whole.
name = "recruiter"
posting = "any"
version = 4

# Must-haves: weight 3. Any failed must-have caps the decision at lean_no.

[[items]]
id = "R1"
text = "The current job title matches the role"
importance = "must"

[[items]]
id = "R2"
text = "Has the years of experience the posting asks for, in dated roles"
importance = "must"

[[items]]
id = "C1"
text = "The top of the CV says what kind of work the candidate does, such as what they build or run; personal qualities or general phrases such as 'digital transformation' do not count"
importance = "must"

# Nice-to-haves: weight 1.
# R3 is strict on purpose (a recruiter skims), so a miss is a presentation fix, not a reason to reject.

[[items]]
id = "R3"
text = "Names the posting's must-have tools in the top third of the CV"
importance = "nice"

[[items]]
id = "R4"
text = "The top third is short lines that can each be read at a glance"
importance = "nice"

[[items]]
id = "C2"
text = "At least one bullet states a result or a scale of the candidate's work with a number, such as users, requests, money or time saved; numbers that describe the company as a whole and duties without numbers do not count"
importance = "nice"
